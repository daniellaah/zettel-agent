name: Free checks and build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check distributable files
        run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: zettel-agent-unreleased-build
          path: |
            main.js
            manifest.json
            styles.css
